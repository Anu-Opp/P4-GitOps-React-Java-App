apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceeyit-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ceeyit-frontend-test
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ceeyit-backend-test
            port:
              number: 8080
