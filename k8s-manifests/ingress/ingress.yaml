apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceeyit-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Forwarded-Proto: http";
      more_set_headers "X-Forwarded-For: $remote_addr";
spec:
  rules:
  - http:
      paths:
      # ArgoCD UI (working)
      - path: /argocd
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
      # Grafana - try different approach
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: prometheus-grafana
            port:
              number: 80
      # Backend API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ceeyit-backend-test
            port:
              number: 8080
      # Frontend (default)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ceeyit-frontend-test
            port:
              number: 80
